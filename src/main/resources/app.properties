# ProjectLedger Application Configuration
# Environment variables override these properties:
# DB_URL, DB_USER, DB_PASSWORD, GITHUB_TOKEN

db.url=jdbc:mysql://localhost:3306/projectledger?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
db.user=root
db.password=
db.pool.maximumPoolSize=10
db.pool.minimumIdle=2
db.pool.idleTimeoutMs=30000
db.pool.connectionTimeoutMs=20000

# Optional GitHub token for higher rate limits (5000 req/hr vs 60 req/hr)
# Can also be set via GITHUB_TOKEN environment variable
github.token=
